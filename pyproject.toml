[project]
name = "test-platform"
version = "0.1.0"
description = "A self-hosted test runner: queues test runs, executes them on workers, and records every test's result."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.16",  # 1.16 reads its settings from this file
    "pydantic-settings>=2.4",
    "defusedxml>=0.7",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.18",  # the login form
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx2>=2.13",  # what FastAPI's TestClient uses
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.alembic]
script_location = "%(here)s/migrations"
# Dated file names, so migrations list in the order they were written.
file_template = "%%(year)d_%%(month).2d_%%(day).2d-%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]

# New migrations come out formatted and lint-clean.
[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format --quiet REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix --quiet REVISION_SCRIPT_FILENAME"
